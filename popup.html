<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <span class="title-icon">⌨</span>
      <span class="title">Shortcut Hint Overlay</span>
    </div>
    <div id="site-toggle-row" class="site-toggle-row" style="display: none;">
      <span id="site-toggle-label" class="site-toggle-label"></span>
      <label class="toggle-switch">
        <input type="checkbox" id="site-toggle">
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>
  <div id="content">
    <div class="message">Loading...</div>
  </div>
  <div class="popup-footer">
    <a href="#" id="settings-link" class="settings-link">⚙ Settings</a>
  </div>
</body>
</html>
